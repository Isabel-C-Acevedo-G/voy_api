description = "API REST VOY — parqueaderos de bicicletas (Medellín)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt==4.0.1",
    "fastapi>=0.165.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.14.4",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.34",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]
